services:
  postgres:
    image: postgres:18
    container_name: digital_bank_postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    
    ports:
      - "51213:5432"

    volumes:
      - postgres_data:/var/lib/postgresql
  
volumes:
  postgres_data:
